name: Build WebCamMicMonitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore and build
        run: msbuild WebCamMicMonitor.sln /restore /t:Build /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Verify application output
        shell: pwsh
        run: |
          if (!(Test-Path 'WebCamMicMonitor/bin/Release/net48/WebCamMicMonitor.exe')) {
            throw 'The build did not produce WebCamMicMonitor.exe.'
          }

      # GitHub provides the artifact as a ZIP containing the app and its dependencies.
      # Running the extracted app requires Windows with .NET Framework 4.8.
      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: WebCamMicMonitor-Release
          path: WebCamMicMonitor/bin/Release/net48/
          if-no-files-found: error
